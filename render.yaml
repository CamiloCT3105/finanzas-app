# Blueprint de Render: crea la API y la versión web de la app con un solo clic.
# Render > New > Blueprint > elige este repositorio. La base de datos va en Neon (gratis, no expira).
services:
  # API REST (backend/)
  - type: web
    name: finanzas-app-api
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Bogota
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # se pega a mano: la cadena de conexión de Neon

  # App web (frontend/), sitio estático
  - type: web
    name: finanzas-app-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npx expo export -p web
    staticPublishPath: dist
    routes:
      # Expo Router en modo "single": todas las rutas las resuelve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_API_URL
        value: https://finanzas-app-api-n6hp.onrender.com/api
